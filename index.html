<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Курсы Татьяны Чернышовой</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #faf6ef);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #2b2926);
    --hint: var(--tg-theme-hint-color, #8a8378);
    --accent: #a83232;
    --accent-soft: #f3e3e0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 16px 14px 40px;
  }
  header { text-align: center; margin-bottom: 6px; }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px; font-weight: 700; letter-spacing: .2px;
  }
  header p { color: var(--hint); font-size: 13px; margin-top: 4px; }
  .lang {
    display: flex; justify-content: center; gap: 8px; margin: 14px 0 18px;
  }
  .lang button {
    border: 1px solid var(--hint); background: transparent; color: var(--text);
    border-radius: 20px; padding: 6px 16px; font-size: 14px; cursor: pointer;
  }
  .lang button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .card .top { display: flex; align-items: baseline; gap: 10px; }
  .card .emoji { font-size: 26px; }
  .card h2 {
    font-family: Georgia, serif; font-size: 17px; font-weight: 700; flex: 1;
  }
  .card .price {
    color: var(--accent); font-weight: 700; font-size: 16px; white-space: nowrap;
  }
  .card .desc { color: var(--hint); font-size: 14px; line-height: 1.45; margin: 8px 0 12px; }
  .card details { margin-bottom: 12px; }
  .card summary {
    color: var(--accent); font-size: 13.5px; cursor: pointer; list-style: none;
  }
  .card summary::after { content: " ▾"; }
  .card details[open] summary::after { content: " ▴"; }
  .card .more { font-size: 14px; line-height: 1.5; margin-top: 8px; white-space: pre-line; }
  .buy {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 15px;
    padding: 12px; border-radius: 12px; border: none; cursor: pointer;
  }
  .buy.secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); margin-top: 8px; }
  .tariffs { display: flex; flex-direction: column; gap: 8px; }
  .note { text-align: center; color: var(--hint); font-size: 12.5px; margin-top: 22px; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1 id="t-title"></h1>
  <p id="t-sub"></p>
</header>
<div class="lang">
  <button id="btn-ru" onclick="setLang('ru')">🇷🇺 Русский</button>
  <button id="btn-ua" onclick="setLang('ua')">🇺🇦 Українська</button>
</div>
<div class="grid" id="grid"></div>
<p class="note" id="t-note"></p>

<script>
const WEBHOOK = "https://script.google.com/macros/s/AKfycbwMvQxzlnc-T01Kk_Ynby0bYBTobC7v_TD0UBe78W0cTe7qoIsgXLCEjj8COL_9DoIwsQ/exec";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const I18N = {
  ru: {
    title: "Курсы Татьяны Чернышовой",
    sub: "Anti-age медицина · протоколы из клинической практики",
    note: "Оплата — через защищённую страницу WayForPay.\nВопросы — кнопкой «Назад» в бота, я подскажу.",
    buy: "Оплатить",
    open: "Подробнее",
    inbot: "Узнать в боте",
  },
  ua: {
    title: "Курси Тетяни Чернишової",
    sub: "Anti-age медицина · протоколи з клінічної практики",
    note: "Оплата — через захищену сторінку WayForPay.\nПитання — кнопкою «Назад» у бота, я підкажу.",
    buy: "Оплатити",
    open: "Детальніше",
    inbot: "Дізнатися в боті",
  },
};

// Каталог. urls: null => кнопки оплаты нет (пока не настроена) — ведём в бота.
const COURSES = {
  ru: [
    { id: "30days", emoji: "📚", title: "Молодость изнутри: 30 дней", price: "от €10",
      desc: "30 уроков — один в день. Сон, дыхание, питание, уход: система, которая работает на клеточном уровне.",
      more: "Не детокс. Не марафон. Протоколы из клинической практики Татьяны.\n\n🟢 Пробный (7 уроков) — €10\n🔵 Базовый (30 уроков + ответы Татьяны в группе) — €100\n🔥 Полный (+ консультация в начале и в конце) — €250",
      tariffs: [
        { label: "🟢 Пробный 7 дней — €10", url: "https://secure.wayforpay.com/button/b1dfd9c78fe33" },
        { label: "🔵 Базовый 30 дней — €100", url: "https://secure.wayforpay.com/button/b14ba4175039e" },
        { label: "🔥 Полный 30 дней — €250", url: "https://secure.wayforpay.com/button/b3df5a30271ea" },
      ] },
    { id: "ferritin", emoji: "🩸", title: "Ферритин: вернуть энергию", price: "€18",
      desc: "Усталость, выпадение волос, бледность — часто скрытый дефицит ферритина. 5 уроков + чек-лист анализов.",
      more: "— Какие анализы сдать (точные цифры, не «в норме»)\n— Почему БАДы железа часто не работают\n— Как поднять и удержать ферритин\n— Связь с щитовидкой, эстрогенами и кожей",
      url: "https://secure.wayforpay.com/button/b55749e6e1ec8" },
    { id: "winter_skin", emoji: "❄️", title: "Уход за кожей зимой", price: "€30",
      desc: "Сухость, шелушение, ранние морщины зимой — это физиология. Как восстановить барьер кожи за 4 недели, дома.",
      more: "— Какие компоненты в уходе работают, а какие вредят\n— Что есть и пить, чтобы кожа не обезвоживалась\n— 5 уроков + протокол ухода",
      url: null },
    { id: "social", emoji: "📱", title: "Социальные сети для эксперта", price: "цена на стр. оплаты",
      desc: "Как расти в Instagram, TikTok и Telegram — без танцев и выгорания. Для врачей, косметологов, экспертов.",
      more: "— Как выбрать платформу под свою экспертизу\n— Структура контента который реально читают\n— Как монетизировать без агрессивных продаж\n— Алгоритмы 2026",
      url: "https://secure.wayforpay.com/button/b4af6c7878dfb" },
    { id: "consult", emoji: "📋", title: "Индивидуальный разбор с Татьяной", price: "€200",
      desc: "60 минут лично, онлайн. Ваш тип старения, разбор ухода, какие анализы сдать — и персональный протокол на руки.",
      more: "Это не общие рекомендации. Это разбор именно вашего случая:\n— почему уходит тонус, появляются отёки или тусклость\n— что в вашем уходе работает против вас\n— конкретный протокол: питание, сон, уход",
      url: "https://secure.wayforpay.com/page?vkh=69c6e97a-39f8-448f-8277-18f922d1dba8" },
  ],
  ua: [
    { id: "30days", emoji: "📚", title: "Молодість зсередини: 30 днів", price: "від €10",
      desc: "30 уроків — один на день. Сон, дихання, харчування, догляд: система, що працює на клітинному рівні.",
      more: "Не детокс. Не марафон. Протоколи з клінічної практики Тетяни.\n\n🟢 Пробний (7 уроків) — €10\n🔵 Базовий (30 уроків + відповіді Тетяни в групі) — €100\n🔥 Повний (+ консультація на початку і в кінці) — €250",
      tariffs: [
        { label: "🟢 Пробний 7 днів — €10", url: "https://secure.wayforpay.com/button/b1dfd9c78fe33" },
        { label: "🔵 Базовий 30 днів — €100", url: "https://secure.wayforpay.com/button/b14ba4175039e" },
        { label: "🔥 Повний 30 днів — €250", url: "https://secure.wayforpay.com/button/b3df5a30271ea" },
      ] },
    { id: "fascia", emoji: "🧘", title: "Фасціальний біль", price: "1000 грн",
      desc: "Коли болить «усе тіло», а аналізи в нормі. 11 уроків: вправи під кожну зону скутості, валик, дихання.",
      more: "Конкретний покроковий план на 2 тижні:\n— вправи під кожну зону скутості\n— самомасаж валиком\n— техніка дихання, що знімає напругу",
      url: "https://secure.wayforpay.com/button/bfdbad490d98f" },
    { id: "social", emoji: "📱", title: "Соціальні мережі для експерта", price: "ціна на стор. оплати",
      desc: "Як зростати в Instagram, TikTok і Telegram — без танців і вигорання. Для лікарів, косметологів, експертів.",
      more: "— Як обрати платформу під свою експертизу\n— Структура контенту який реально читають\n— Як монетизувати без агресивних продажів\n— Алгоритми 2026",
      url: "https://secure.wayforpay.com/button/b4af6c7878dfb" },
    { id: "book", emoji: "📖", title: "Книга «Склянка води»", price: "ціна на стор. оплати",
      desc: "Про лімфатичну систему, водний баланс і просту систему підтримки тіла. Інструкція, яка працює.",
      more: "— Чому лімфа — головна система детоксу\n— Прості техніки запуску лімфи на 5 хвилин на день\n— Зв'язок водного балансу зі шкірою, енергією, набряками",
      url: "https://secure.wayforpay.com/button/bcaafaf774eaa" },
    { id: "consult", emoji: "📋", title: "Індивідуальний розбір з Тетяною", price: "€200",
      desc: "60 хвилин особисто, онлайн. Ваш тип старіння, розбір догляду, які аналізи здати — і персональний протокол.",
      more: "Це не загальні рекомендації. Це розбір саме вашого випадку:\n— чому йде тонус, з'являються набряки або тьмяність\n— що у вашому догляді працює проти вас\n— конкретний протокол: харчування, сон, догляд",
      url: "https://secure.wayforpay.com/page?vkh=69c6e97a-39f8-448f-8277-18f922d1dba8" },
  ],
};

const BOT_URL = "https://t.me/dr_chernyshova_bot";
let lang = "ru";
const tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
if (tgLang && tgLang.startsWith("uk")) lang = "ua";

function track(event, source) {
  try {
    const uid = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 0;
    fetch(WEBHOOK, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        timestamp: new Date().toISOString(), record: "event", event: event,
        telegram_id: uid, telegram_username: "", lang: lang, direction: "b2c",
        source: source || "webapp",
      }),
    });
  } catch (e) { /* аналитика не должна ломать витрину */ }
}

function openPay(url, id) {
  track("webapp_pay_" + id);
  if (tg) tg.openLink(url); else window.open(url, "_blank");
}

function setLang(l) {
  lang = l;
  const t = I18N[l];
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-sub").textContent = t.sub;
  document.getElementById("t-note").textContent = t.note;
  document.getElementById("btn-ru").className = l === "ru" ? "active" : "";
  document.getElementById("btn-ua").className = l === "ua" ? "active" : "";
  const grid = document.getElementById("grid");
  grid.replaceChildren();

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const payBtn = (label, url, id, secondary) => {
    const b = el("button", "buy" + (secondary ? " secondary" : ""), label);
    b.addEventListener("click", () => openPay(url, id));
    return b;
  };

  for (const c of COURSES[l]) {
    const card = el("div", "card");

    const top = el("div", "top");
    top.appendChild(el("span", "emoji", c.emoji));
    top.appendChild(el("h2", null, c.title));
    top.appendChild(el("span", "price", c.price));
    card.appendChild(top);

    card.appendChild(el("p", "desc", c.desc));

    const details = el("details");
    details.appendChild(el("summary", null, t.open));
    details.appendChild(el("div", "more", c.more));
    card.appendChild(details);

    if (c.tariffs) {
      const box = el("div", "tariffs");
      c.tariffs.forEach((tr, i) => box.appendChild(payBtn(tr.label, tr.url, c.id + "_" + i, i > 0)));
      card.appendChild(box);
    } else if (c.url) {
      card.appendChild(payBtn(t.buy + " →", c.url, c.id, false));
    } else {
      const a = el("a", "buy secondary", t.inbot + " →");
      a.href = BOT_URL;
      card.appendChild(a);
    }
    grid.appendChild(card);
  }
}

setLang(lang);
track("webapp_open");
</script>
</body>
</html>
